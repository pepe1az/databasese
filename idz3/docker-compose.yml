services:
  keeper1:
    image: clickhouse/clickhouse-keeper:24.8
    container_name: keeper1
    hostname: keeper1
    volumes:
      - ./config/keeper/keeper1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper1-data:/var/lib/clickhouse-keeper
    ports:
      - "9181:9181"

  keeper2:
    image: clickhouse/clickhouse-keeper:24.8
    container_name: keeper2
    hostname: keeper2
    volumes:
      - ./config/keeper/keeper2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper2-data:/var/lib/clickhouse-keeper
    ports:
      - "9182:9181"

  keeper3:
    image: clickhouse/clickhouse-keeper:24.8
    container_name: keeper3
    hostname: keeper3
    volumes:
      - ./config/keeper/keeper3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper3-data:/var/lib/clickhouse-keeper
    ports:
      - "9183:9181"

  clickhouse1:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse1
    hostname: clickhouse1
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/node1_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - clickhouse1-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"

  clickhouse2:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse2
    hostname: clickhouse2
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/node2_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - clickhouse2-data:/var/lib/clickhouse
    ports:
      - "8124:8123"
      - "9001:9000"

  clickhouse3:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse3
    hostname: clickhouse3
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/node3_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - clickhouse3-data:/var/lib/clickhouse
    ports:
      - "8125:8123"
      - "9002:9000"

volumes:
  keeper1-data:
  keeper2-data:
  keeper3-data:
  clickhouse1-data:
  clickhouse2-data:
  clickhouse3-data:
