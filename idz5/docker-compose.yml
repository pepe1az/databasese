services:
  manticore:
    image: manticoresearch/manticore:latest
    container_name: idz5-manticore
    ports:
      - "9306:9306"
      - "9308:9308"
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - manticore_data:/var/lib/manticore
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: idz5-postgres
    environment:
      POSTGRES_DB: idz5
      POSTGRES_USER: idz5
      POSTGRES_PASSWORD: idz5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mysql-client:
    image: mysql:8.4
    container_name: idz5-mysql-client
    command: ["sleep", "infinity"]
    profiles: ["tools"]

volumes:
  manticore_data:
  postgres_data:
